<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <center>
        <table id="calculator" border="2" width="700" height="700">
            <tr>
                <td id="result" colspan="9" style="text-align: center;">0</td>
            </tr>
            <tr>
                <td class="numberbcolor" style="text-align: center;">1</td>
                <td class="numberbcolor" style="text-align: center;">2</td>
                <td class="numberbcolor" style="text-align: center;">3</td>
            </tr>
            <tr>
                <td class="numberbcolor" style="text-align: center;">4</td>
                <td class="numberbcolor" style="text-align: center;">5</td>
                <td class="numberbcolor" style="text-align: center;">6</td>
            </tr>
            <tr>
                <td class="numberbcolor" style="text-align: center;">7</td>
                <td class="numberbcolor" style="text-align: center;">8</td>
                <td class="numberbcolor" style="text-align: center;">9</td>
            </tr>
            <tr>
                <td style="border-style: hidden;"></td>
            </tr>
            <tr>
                <td class="numberbcolor" style="text-align: center; ">+</td>
                <td class="numberbcolor" style="text-align: center; ">-</td>
                <td class="numberbcolor" style="text-align: center; ">C</td>
            </tr>
            <tr>
                <td class="numberbcolor" style="text-align: center;">*</td>
                <td class="numberbcolor" style="text-align: center; ">/</td>
                <td class="numberbcolor" style="text-align: center; ">=</td>
            </tr>
        </table>
    </center>
</body>

</html>
